{% extends 'xiaobai/page.html' %}
{% block title %}登录{% endblock %}
{% block body %}
<div class="card glass rise d2"><span class="spot" aria-hidden="true"></span>
  <h1>登录</h1>
  <form action="{% url 'user-login' %}?next={{ next }}" method="post">
    {% csrf_token %}
    <label for="email">账号</label>
    <input type="text" name="email" id="email" value="{{ form.data.email|default:'' }}" autocomplete="username" autofocus>
    <label for="password">密码</label>
    <input type="password" name="password" id="password" autocomplete="current-password">
    <input type="hidden" name="persist_session" value="on">
    {% if form.errors %}<p class="error">账号或密码不对</p>{% endif %}
    <button class="btn primary block" type="submit">登录</button>
  </form>
  {% if not settings.DISABLE_SIGNUP_WITHOUT_LINK %}
  <div class="switch">还没有账号？<a href="{% url 'user-signup' %}{% if next %}?next={{ next }}{% endif %}">注册一个</a></div>
  {% endif %}
</div>
{% endblock %}
